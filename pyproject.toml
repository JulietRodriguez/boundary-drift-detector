[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boundary-drift-detector"
version = "0.1.0"
description = "Compare a declared authorization boundary (OSCAL SSP or YAML) with what actually exists in AWS (Config inventory or Terraform state) and report drift as OSCAL."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Juliet Rodriguez" }]
keywords = ["rmf", "authorization-boundary", "oscal", "aws-config", "terraform", "inventory", "cm-8", "grc"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
]
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
aws = ["boto3>=1.28"]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff==0.16.9", "jsonschema>=4.17"]

[project.scripts]
boundary-drift-detector = "boundary_drift_detector.cli:main"

[project.urls]
Homepage = "https://github.com/JulietRodriguez/boundary-drift-detector"
Issues = "https://github.com/JulietRodriguez/boundary-drift-detector/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra"

[tool.coverage.run]
source = ["boundary_drift_detector"]
branch = true

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "C4", "PIE"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]
"tools/make_samples.py" = ["E501"]
